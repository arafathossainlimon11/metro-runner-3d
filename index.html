<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Metro Runner 3D</title>
    <!-- Three.js 3D Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05050d;
        }

        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Overlay Layouts */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            padding: 10px;
        }

        /* Top & Bottom Ad Area (১ এবং ২ চিহ্নিত স্থান) */
        .ad-zone-top, .ad-zone-bottom {
            width: 100%;
            min-height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            pointer-events: auto;
        }

        /* Card Container */
        .card-menu {
            background: rgba(10, 15, 30, 0.94);
            border: 2px solid #00f0ff;
            border-radius: 18px;
            padding: 20px 15px;
            text-align: center;
            color: #ffffff;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.35);
            max-width: 360px;
            width: 92%;
            pointer-events: auto;
            margin: auto 0;
        }

        .title-text {
            font-size: 26px;
            font-weight: 900;
            color: #00f0ff;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(0,240,255,0.5);
        }

        .btn {
            background: linear-gradient(135deg, #a100ff, #ff007f);
            border: none;
            color: #ffffff;
            padding: 14px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 12px;
            width: 100%;
            box-shadow: 0 5px 15px rgba(255, 0, 127, 0.4);
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-reward {
            background: linear-gradient(135deg, #ff9900, #ff0044);
            box-shadow: 0 5px 15px rgba(255, 153, 0, 0.5);
        }

        .ad-box-native {
            width: 100%;
            min-height: 140px;
            margin: 12px 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed #00f0ff;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            overflow: hidden;
        }

        /* HUD Screen */
        #hud-screen {
            pointer-events: none;
            display: none;
        }

        .hud-top {
            width: 100%;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            padding: 5px 15px;
        }

        #game-over-screen {
            display: none;
        }
    </style>

    <!-- ADSTERRA SOCIAL BAR CODE PLACEHOLDER -->
</head>
<body>

    <div id="game-container">
        
        <!-- HOME / START SCREEN -->
        <div id="start-screen" class="screen">
            <!-- ১: TOP AD BANNER -->
            <div class="ad-zone-top">
                <!-- ADSTERRA BANNER 320x50 SCRIPT HERE -->
            </div>

            <div class="card-menu">
                <h1 class="title-text">METRO RUNNER 3D</h1>
                <p style="font-size: 14px; color: #ccc;">কন্ট্রোল করতে স্ক্রিনে ডানে/বামে সোয়াইপ করুন</p>
                
                <!-- HOME NATIVE AD -->
                <div class="ad-box-native">
                    <!-- Paste Adsterra Native 300x250 Script Here -->
                </div>

                <button class="btn" onclick="startGame()">START GAME</button>
            </div>

            <!-- ২: BOTTOM AD BANNER -->
            <div class="ad-zone-bottom">
                <!-- ADSTERRA BANNER 320x50 SCRIPT HERE -->
            </div>
        </div>

        <!-- HUD SCREEN (DURING GAMEPLAY) -->
        <div id="hud-screen" class="screen">
            <div class="hud-top">
                <div>SCORE: <span id="scoreText">0</span></div>
                <div>COINS: 🟡 <span id="coinText">0</span></div>
            </div>
            
            <div class="ad-zone-top">
                <!-- ADSTERRA BANNER 320x50 HERE -->
            </div>
            <div></div>
        </div>

        <!-- GAME OVER SCREEN (চিহ্নিত ১ এবং ২ নম্বর লেআউট অনুযায়ী) -->
        <div id="game-over-screen" class="screen">
            <!-- ১: TOP AD BANNER -->
            <div class="ad-zone-top">
                <!-- ADSTERRA STICKY BANNER 320x50 HERE -->
            </div>

            <div class="card-menu">
                <h1 class="title-text" style="color: #ff0055;">GAME OVER</h1>
                <p style="font-size: 16px;">আপনার স্কোর: <b id="finalScore" style="color:#00f0ff;">0</b></p>
                <p style="font-size: 16px;">সংগৃহীত কয়েন: <b id="finalCoins" style="color:#ffcc00;">0</b></p>

                <!-- ADSTERRA DIRECT LINK (REWARD AD) -->
                <button class="btn btn-reward" onclick="openDirectLinkAd()">Watch Ad for 2X Bonus</button>

                <!-- NATIVE AD IN GAME OVER -->
                <div class="ad-box-native">
                    <!-- Paste Adsterra Native Code Here -->
                </div>

                <button class="btn" onclick="restartGame()">PLAY AGAIN</button>
            </div>

            <!-- ২: BOTTOM AD BANNER -->
            <div class="ad-zone-bottom">
                <!-- ADSTERRA STICKY BANNER 320x50 HERE -->
            </div>
        </div>

    </div>

    <!-- 3D GAME ENGINE & AUDIO SCRIPT -->
    <script>
        let scene, camera, renderer;
        let player, leftArm, rightArm, leftLeg, rightLeg;
        let isPlaying = false;
        let score = 0, coins = 0;
        let currentLane = 0; // -1: Left, 0: Center, 1: Right
        const laneWidth = 2.4;
        
        let obstacles = [];
        let coinObjects = [];
        let pillars = [];
        let gameSpeed = 0.38;
        let isJumping = false;
        let jumpVelocity = 0;
        const gravity = 0.018;
        let animTimer = 0;

        const cameraOffset = new THREE.Vector3(0, 3.2, 6.5);

        // --- WEB AUDIO SYSTEM (Sound & Music) ---
        let audioCtx = null;
        let bgmInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // Play Coin Collection Sound Effect
        function playCoinSound() {
            if (!audioCtx) return;
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                
                // Frequency sweep for "ding" sound
                osc.frequency.setValueAtTime(987.77, audioCtx.currentTime); // B5 note
                osc.frequency.exponentialRampToValueAtTime(1318.51, audioCtx.currentTime + 0.08); // E6 note

                gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.12);
            } catch (e) {}
        }

        // Background Music Synth Generator
        function startBGM() {
            if (bgmInterval) clearInterval(bgmInterval);
            const notes = [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 293.66, 349.23];
            let step = 0;

            bgmInterval = setInterval(() => {
                if (!isPlaying || !audioCtx) return;
                try {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(notes[step % notes.length], audioCtx.currentTime);

                    gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.18);
                    step++;
                } catch(e) {}
            }, 200);
        }

        function stopBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        // --- THREE.JS GRAPHICS SETUP ---
        function initEngine() {
            const container = document.getElementById('game-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x060612);
            scene.fog = new THREE.FogExp2(0x060612, 0.018);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Lighting for Shiny Gold & Neon Effects
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
            dirLight.position.set(5, 25, 15);
            scene.add(dirLight);

            // Track Ground
            const groundGeo = new THREE.PlaneGeometry(9, 600);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.4 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.z = -250;
            scene.add(ground);

            // Neon Lane Lines
            for(let i = -1; i <= 1; i += 2) {
                const lineGeo = new THREE.PlaneGeometry(0.12, 600);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(i * (laneWidth / 2 + 0.6), 0.02, -250);
                scene.add(line);
            }

            // Side Pillars
            for(let z = 0; z > -500; z -= 20) {
                createSidePillar(-6, z);
                createSidePillar(6, z);
            }

            // Create Animated Humanoid Player
            createPlayer();

            // Window Resize & Controls
            window.addEventListener('resize', onWindowResize);
            setupControls();

            // Render Loop
            animate();
        }

        function createSidePillar(x, z) {
            const geo = new THREE.BoxGeometry(0.6, 8, 0.6);
            const mat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0x330011 });
            const pillar = new THREE.Mesh(geo, mat);
            pillar.position.set(x, 4, z);
            scene.add(pillar);
            pillars.push(pillar);
        }

        // --- CHARACTER MODEL WITH LIMBS ---
        function createPlayer() {
            player = new THREE.Group();
            
            // Torso (Body)
            const bodyGeo = new THREE.BoxGeometry(0.75, 1.1, 0.45);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00f0ff, roughness: 0.2 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 1.05;
            player.add(body);

            // Head
            const headGeo = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xff007f });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.85;
            player.add(head);

            // Material for Arms & Legs
            const limbMat = new THREE.MeshStandardMaterial({ color: 0x112244 });
            const armMat = new THREE.MeshStandardMaterial({ color: 0xff007f });

            // Left Arm
            leftArm = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.8, 0.22), armMat);
            leftArm.geometry.translate(0, -0.35, 0); // Pivot at shoulder
            leftArm.position.set(-0.52, 1.5, 0);
            player.add(leftArm);

            // Right Arm
            rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.8, 0.22), armMat);
            rightArm.geometry.translate(0, -0.35, 0);
            rightArm.position.set(0.52, 1.5, 0);
            player.add(rightArm);

            // Left Leg
            leftLeg = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.85, 0.26), limbMat);
            leftLeg.geometry.translate(0, -0.4, 0); // Pivot at hip
            leftLeg.position.set(-0.22, 0.85, 0);
            player.add(leftLeg);

            // Right Leg
            rightLeg = new THREE.Mesh(new THREE.BoxGeometry(0.26, 0.85, 0.26), limbMat);
            rightLeg.geometry.translate(0, -0.4, 0);
            rightLeg.position.set(0.22, 0.85, 0);
            player.add(rightLeg);

            player.position.set(0, 0, 0);
            scene.add(player);
        }

        function setupControls() {
            window.addEventListener('keydown', (e) => {
                if (!isPlaying) return;
                if (e.key === 'ArrowLeft' || e.key === 'a') moveLane(-1);
                if (e.key === 'ArrowRight' || e.key === 'd') moveLane(1);
                if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') && !isJumping) jump();
            });

            let touchStartX = 0, touchStartY = 0;

            window.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            });

            window.addEventListener('touchend', (e) => {
                if (!isPlaying) return;
                let diffX = e.changedTouches[0].clientX - touchStartX;
                let diffY = e.changedTouches[0].clientY - touchStartY;

                if (Math.abs(diffX) > Math.abs(diffY)) {
                    if (diffX > 30) moveLane(1);
                    else if (diffX < -30) moveLane(-1);
                } else {
                    if (diffY < -30 && !isJumping) jump();
                }
            });
        }

        function moveLane(dir) {
            currentLane = Math.max(-1, Math.min(1, currentLane + dir));
        }

        function jump() {
            isJumping = true;
            jumpVelocity = 0.3;
        }

        function spawnElements() {
            // Obstacles
            if (Math.random() < 0.05) {
                let lane = Math.floor(Math.random() * 3) - 1;
                const obsGeo = new THREE.BoxGeometry(1.3, 1.3, 1.3);
                const obsMat = new THREE.MeshStandardMaterial({ color: 0xff0055 });
                const obs = new THREE.Mesh(obsGeo, obsMat);
                obs.position.set(lane * laneWidth, 0.65, -80);
                scene.add(obs);
                obstacles.push(obs);
            }

            // SHINY GOLDEN COINS
            if (Math.random() < 0.08) {
                let lane = Math.floor(Math.random() * 3) - 1;
                const coinGeo = new THREE.CylinderGeometry(0.45, 0.45, 0.12, 20);
                const coinMat = new THREE.MeshStandardMaterial({ 
                    color: 0xffd700, 
                    metalness: 0.95, 
                    roughness: 0.1,
                    emissive: 0x554400 
                });
                const coin = new THREE.Mesh(coinGeo, coinMat);
                coin.rotation.x = Math.PI / 2;
                coin.position.set(lane * laneWidth, 1.0, -80);
                scene.add(coin);
                coinObjects.push(coin);
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying) {
                animTimer += 0.18;

                // Smooth Lane Movement
                const targetX = currentLane * laneWidth;
                player.position.x += (targetX - player.position.x) * 0.22;

                // Running Animation for Arms & Legs
                if (!isJumping) {
                    leftArm.rotation.x = Math.sin(animTimer) * 0.75;
                    rightArm.rotation.x = -Math.sin(animTimer) * 0.75;
                    leftLeg.rotation.x = -Math.sin(animTimer) * 0.75;
                    rightLeg.rotation.x = Math.sin(animTimer) * 0.75;
                } else {
                    // Jump Pose
                    leftArm.rotation.x = -1.2;
                    rightArm.rotation.x = -1.2;
                    leftLeg.rotation.x = 0.5;
                    rightLeg.rotation.x = -0.5;
                }

                // Jump Gravity Logic
                if (isJumping) {
                    player.position.y += jumpVelocity;
                    jumpVelocity -= gravity;
                    if (player.position.y <= 0) {
                        player.position.y = 0;
                        isJumping = false;
                    }
                }

                // Locked Camera Follow
                camera.position.x = player.position.x;
                camera.position.y = player.position.y + cameraOffset.y;
                camera.position.z = player.position.z + cameraOffset.z;
                camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z - 5);

                // Side Pillars Movement
                pillars.forEach(p => {
                    p.position.z += gameSpeed;
                    if (p.position.z > 10) p.position.z -= 500;
                });

                spawnElements();

                // Obstacle Movement & Collision
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.position.z += gameSpeed;

                    if (Math.abs(obs.position.z - player.position.z) < 0.8 &&
                        Math.abs(obs.position.x - player.position.x) < 0.8 &&
                        player.position.y < 1.1) {
                        gameOver();
                    }

                    if (obs.position.z > 10) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                    }
                }

                // Golden Coin Movement, Spinning & Pickup
                for (let i = coinObjects.length - 1; i >= 0; i--) {
                    let coin = coinObjects[i];
                    coin.position.z += gameSpeed;
                    coin.rotation.z += 0.08; // Fast Gold Spin

                    if (Math.abs(coin.position.z - player.position.z) < 0.85 &&
                        Math.abs(coin.position.x - player.position.x) < 0.85 &&
                        Math.abs(coin.position.y - (player.position.y + 1.0)) < 1.0) {
                        
                        coins += 1;
                        document.getElementById('coinText').innerText = coins;
                        playCoinSound(); // Trigger Pickup SFX
                        scene.remove(coin);
                        coinObjects.splice(i, 1);
                    }

                    if (coin && coin.position.z > 10) {
                        scene.remove(coin);
                        coinObjects.splice(i, 1);
                    }
                }

                score += 1;
                document.getElementById('scoreText').innerText = Math.floor(score / 4);
                gameSpeed += 0.00004;
            }

            renderer.render(scene, camera);
        }

        function startGame() {
            initAudio();
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('hud-screen').style.display = 'flex';
            resetData();
            isPlaying = true;
            startBGM();
        }

        function gameOver() {
            isPlaying = false;
            stopBGM();
            document.getElementById('hud-screen').style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'flex';
            document.getElementById('finalScore').innerText = Math.floor(score / 4);
            document.getElementById('finalCoins').innerText = coins;
        }

        function restartGame() {
            initAudio();
            document.getElementById('game-over-screen').style.display = 'none';
            document.getElementById('hud-screen').style.display = 'flex';
            
            obstacles.forEach(obs => scene.remove(obs));
            coinObjects.forEach(coin => scene.remove(coin));
            obstacles = [];
            coinObjects = [];

            resetData();
            isPlaying = true;
            startBGM();
        }

        function resetData() {
            score = 0;
            coins = 0;
            gameSpeed = 0.38;
            currentLane = 0;
            player.position.set(0, 0, 0);
            camera.position.set(0, 3.2, 6.5);
            document.getElementById('scoreText').innerText = '0';
            document.getElementById('coinText').innerText = '0';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function openDirectLinkAd() {
            // Adsterra Direct Link / Smartlink URL
            window.open('https://www.google.com', '_blank'); 
        }

        window.onload = initEngine;
    </script>
</body>
                </html>
