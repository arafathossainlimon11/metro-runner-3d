<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Metro Runner 3D</title>
    <!-- Three.js 3D Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #05050d;
        }

        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Overlay Layouts */
        .screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            padding: 10px;
        }

        /* Top & Bottom Ad Area (১ এবং ২ চিহ্নিত স্থান) */
        .ad-zone-top, .ad-zone-bottom {
            width: 100%;
            min-height: 55px;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            pointer-events: auto;
        }

        /* Card Container */
        .card-menu {
            background: rgba(10, 15, 30, 0.92);
            border: 2px solid #00f0ff;
            border-radius: 18px;
            padding: 20px 15px;
            text-align: center;
            color: #ffffff;
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.3);
            max-width: 360px;
            width: 92%;
            pointer-events: auto;
            margin: auto 0;
        }

        .title-text {
            font-size: 26px;
            font-weight: 900;
            color: #00f0ff;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(0,240,255,0.5);
        }

        .btn {
            background: linear-gradient(135deg, #a100ff, #ff007f);
            border: none;
            color: #ffffff;
            padding: 14px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            margin-top: 12px;
            width: 100%;
            box-shadow: 0 5px 15px rgba(255, 0, 127, 0.4);
            transition: transform 0.1s active;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-reward {
            background: linear-gradient(135deg, #ff9900, #ff0044);
            box-shadow: 0 5px 15px rgba(255, 153, 0, 0.5);
        }

        .ad-box-native {
            width: 100%;
            min-height: 140px;
            margin: 12px 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px dashed #00f0ff;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 10px;
            overflow: hidden;
        }

        /* HUD Screen */
        #hud-screen {
            pointer-events: none;
            display: none;
        }

        .hud-top {
            width: 100%;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
            padding: 5px 15px;
        }

        #game-over-screen {
            display: none;
        }
    </style>

    <!-- ADSTERRA SOCIAL BAR CODE PLACEHOLDER -->
</head>
<body>

    <div id="game-container">
        
        <!-- HOME / START SCREEN -->
        <div id="start-screen" class="screen">
            <!-- ১: TOP AD BANNER -->
            <div class="ad-zone-top">
                <!-- ADSTERRA BANNER 320x50 SCRIPT HERE -->
            </div>

            <div class="card-menu">
                <h1 class="title-text">METRO RUNNER 3D</h1>
                <p style="font-size: 14px; color: #ccc;">কন্ট্রোল করতে স্ক্রিনে ডানে/বামে সোয়াইপ করুন</p>
                
                <!-- HOME NATIVE AD -->
                <div class="ad-box-native">
                    <!-- Paste Adsterra Native 300x250 Script Here -->
                </div>

                <button class="btn" onclick="startGame()">START GAME</button>
            </div>

            <!-- ২: BOTTOM AD BANNER -->
            <div class="ad-zone-bottom">
                <!-- ADSTERRA BANNER 320x50 SCRIPT HERE -->
            </div>
        </div>

        <!-- HUD SCREEN (DURING GAMEPLAY) -->
        <div id="hud-screen" class="screen">
            <div class="hud-top">
                <div>SCORE: <span id="scoreText">0</span></div>
                <div>COINS: 🟡 <span id="coinText">0</span></div>
            </div>
            
            <div class="ad-zone-top">
                <!-- ADSTERRA BANNER 320x50 HERE -->
            </div>
            <div></div>
        </div>

        <!-- GAME OVER SCREEN (চিহ্নিত ১ এবং ২ ফরম্যাট অনুযায়ী) -->
        <div id="game-over-screen" class="screen">
            <!-- ১: TOP AD BANNER -->
            <div class="ad-zone-top">
                <!-- ADSTERRA STICKY BANNER 320x50 HERE -->
            </div>

            <div class="card-menu">
                <h1 class="title-text" style="color: #ff0055;">GAME OVER</h1>
                <p style="font-size: 16px;">আপনার স্কোর: <b id="finalScore" style="color:#00f0ff;">0</b></p>
                <p style="font-size: 16px;">সংগৃহীত কয়েন: <b id="finalCoins" style="color:#ffcc00;">0</b></p>

                <!-- ADSTERRA DIRECT LINK (REWARD AD) -->
                <button class="btn btn-reward" onclick="openDirectLinkAd()">Watch Ad for 2X Bonus</button>

                <!-- NATIVE AD IN GAME OVER -->
                <div class="ad-box-native">
                    <!-- Paste Adsterra Native Code Here -->
                </div>

                <button class="btn" onclick="restartGame()">PLAY AGAIN</button>
            </div>

            <!-- ২: BOTTOM AD BANNER -->
            <div class="ad-zone-bottom">
                <!-- ADSTERRA STICKY BANNER 320x50 HERE -->
            </div>
        </div>

    </div>

    <!-- 3D GAME ENGINE SCRIPT -->
    <script>
        let scene, camera, renderer;
        let player, playerBody;
        let isPlaying = false;
        let score = 0, coins = 0;
        let currentLane = 0; // -1: Left, 0: Center, 1: Right
        const laneWidth = 2.4;
        
        let obstacles = [];
        let coinObjects = [];
        let pillars = [];
        let gameSpeed = 0.38;
        let isJumping = false;
        let jumpVelocity = 0;
        const gravity = 0.018;

        // Camera Offset Locked to Player
        const cameraOffset = new THREE.Vector3(0, 3.2, 6.5);

        function initEngine() {
            const container = document.getElementById('game-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x060612);
            scene.fog = new THREE.FogExp2(0x060612, 0.02);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Lights
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0x00ffff, 1.0);
            dirLight.position.set(5, 20, 10);
            scene.add(dirLight);

            // Track Ground
            const groundGeo = new THREE.PlaneGeometry(9, 600);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x111122, roughness: 0.4 });
            const ground = new THREE.Mesh(groundGeo, groundMat);
            ground.rotation.x = -Math.PI / 2;
            ground.position.z = -250;
            scene.add(ground);

            // Neon Lane Lines
            for(let i = -1; i <= 1; i += 2) {
                const lineGeo = new THREE.PlaneGeometry(0.12, 600);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.rotation.x = -Math.PI / 2;
                line.position.set(i * (laneWidth / 2 + 0.6), 0.02, -250);
                scene.add(line);
            }

            // Side Pillars for Visual Quality
            for(let z = 0; z > -500; z -= 20) {
                createSidePillar(-6, z);
                createSidePillar(6, z);
            }

            // Create Player
            createPlayer();

            // Resize & Controls
            window.addEventListener('resize', onWindowResize);
            setupControls();

            // Render
            animate();
        }

        function createSidePillar(x, z) {
            const geo = new THREE.BoxGeometry(0.6, 8, 0.6);
            const mat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0x330011 });
            const pillar = new THREE.Mesh(geo, mat);
            pillar.position.set(x, 4, z);
            scene.add(pillar);
            pillars.push(pillar);
        }

        function createPlayer() {
            player = new THREE.Group();
            
            // Body
            const bodyGeo = new THREE.BoxGeometry(0.9, 1.4, 0.7);
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00f0ff, roughness: 0.2 });
            playerBody = new THREE.Mesh(bodyGeo, bodyMat);
            playerBody.position.y = 0.7;
            player.add(playerBody);

            // Head
            const headGeo = new THREE.BoxGeometry(0.55, 0.55, 0.55);
            const headMat = new THREE.MeshStandardMaterial({ color: 0xff007f });
            const head = new THREE.Mesh(headGeo, headMat);
            head.position.y = 1.65;
            player.add(head);

            player.position.set(0, 0, 0);
            scene.add(player);
        }

        function setupControls() {
            // Keyboard
            window.addEventListener('keydown', (e) => {
                if (!isPlaying) return;
                if (e.key === 'ArrowLeft' || e.key === 'a') moveLane(-1);
                if (e.key === 'ArrowRight' || e.key === 'd') moveLane(1);
                if ((e.key === 'ArrowUp' || e.key === 'w' || e.key === ' ') && !isJumping) jump();
            });

            // Touch Swipe
            let touchStartX = 0, touchStartY = 0;

            window.addEventListener('touchstart', (e) => {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            });

            window.addEventListener('touchend', (e) => {
                if (!isPlaying) return;
                let diffX = e.changedTouches[0].clientX - touchStartX;
                let diffY = e.changedTouches[0].clientY - touchStartY;

                if (Math.abs(diffX) > Math.abs(diffY)) {
                    if (diffX > 30) moveLane(1);
                    else if (diffX < -30) moveLane(-1);
                } else {
                    if (diffY < -30 && !isJumping) jump();
                }
            });
        }

        function moveLane(dir) {
            currentLane = Math.max(-1, Math.min(1, currentLane + dir));
        }

        function jump() {
            isJumping = true;
            jumpVelocity = 0.3;
        }

        function spawnElements() {
            if (Math.random() < 0.05) {
                let lane = Math.floor(Math.random() * 3) - 1;
                const obsGeo = new THREE.BoxGeometry(1.3, 1.3, 1.3);
                const obsMat = new THREE.MeshStandardMaterial({ color: 0xff0055 });
                const obs = new THREE.Mesh(obsGeo, obsMat);
                obs.position.set(lane * laneWidth, 0.65, -80);
                scene.add(obs);
                obstacles.push(obs);
            }

            if (Math.random() < 0.08) {
                let lane = Math.floor(Math.random() * 3) - 1;
                const coinGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.1, 16);
                const coinMat = new THREE.MeshStandardMaterial({ color: 0xffcc00, metalness: 0.9, roughness: 0.1 });
                const coin = new THREE.Mesh(coinGeo, coinMat);
                coin.rotation.x = Math.PI / 2;
                coin.position.set(lane * laneWidth, 0.9, -80);
                scene.add(coin);
                coinObjects.push(coin);
            }
        }

        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying) {
                // Smooth Horizontal Lane Movement
                const targetX = currentLane * laneWidth;
                player.position.x += (targetX - player.position.x) * 0.22;

                // Jump Mechanics
                if (isJumping) {
                    player.position.y += jumpVelocity;
                    jumpVelocity -= gravity;
                    if (player.position.y <= 0) {
                        player.position.y = 0;
                        isJumping = false;
                    }
                }

                // CAMERA FOLLOWS PLAYER EXACTLY (LOCKED CAMERA)
                camera.position.x = player.position.x;
                camera.position.y = player.position.y + cameraOffset.y;
                camera.position.z = player.position.z + cameraOffset.z;
                camera.lookAt(player.position.x, player.position.y + 1.2, player.position.z - 5);

                // Move Pillars
                pillars.forEach(p => {
                    p.position.z += gameSpeed;
                    if (p.position.z > 10) p.position.z -= 500;
                });

                spawnElements();

                // Obstacles collision & movement
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.position.z += gameSpeed;

                    if (Math.abs(obs.position.z - player.position.z) < 0.8 &&
                        Math.abs(obs.position.x - player.position.x) < 0.8 &&
                        player.position.y < 1.1) {
                        gameOver();
                    }

                    if (obs.position.z > 10) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                    }
                }

                // Coins Collection
                for (let i = coinObjects.length - 1; i >= 0; i--) {
                    let coin = coinObjects[i];
                    coin.position.z += gameSpeed;
                    coin.rotation.z += 0.06;

                    if (Math.abs(coin.position.z - player.position.z) < 0.8 &&
                        Math.abs(coin.position.x - player.position.x) < 0.8) {
                        coins += 1;
                        document.getElementById('coinText').innerText = coins;
                        scene.remove(coin);
                        coinObjects.splice(i, 1);
                    }

                    if (coin && coin.position.z > 10) {
                        scene.remove(coin);
                        coinObjects.splice(i, 1);
                    }
                }

                score += 1;
                document.getElementById('scoreText').innerText = Math.floor(score / 4);
                gameSpeed += 0.00004;
            }

            renderer.render(scene, camera);
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('hud-screen').style.display = 'flex';
            resetData();
            isPlaying = true;
        }

        function gameOver() {
            isPlaying = false;
            document.getElementById('hud-screen').style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'flex';
            document.getElementById('finalScore').innerText = Math.floor(score / 4);
            document.getElementById('finalCoins').innerText = coins;
        }

        function restartGame() {
            document.getElementById('game-over-screen').style.display = 'none';
            document.getElementById('hud-screen').style.display = 'flex';
            
            obstacles.forEach(obs => scene.remove(obs));
            coinObjects.forEach(coin => scene.remove(coin));
            obstacles = [];
            coinObjects = [];

            resetData();
            isPlaying = true;
        }

        function resetData() {
            score = 0;
            coins = 0;
            gameSpeed = 0.38;
            currentLane = 0;
            player.position.set(0, 0, 0);
            camera.position.set(0, 3.2, 6.5);
            document.getElementById('scoreText').innerText = '0';
            document.getElementById('coinText').innerText = '0';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function openDirectLinkAd() {
            // Adsterra Direct Link/Smartlink URL এখানে বসাবেন
            window.open('https://www.google.com', '_blank'); 
        }

        window.onload = initEngine;
    </script>
</body>
  </html>
